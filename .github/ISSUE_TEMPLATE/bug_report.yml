name: 使用问题反馈
description: 反馈声页听吟的使用问题或购买恢复问题
title: "[问题反馈] "
body:
  - type: markdown
    attributes:
      value: "感谢反馈。本页面公开可见，请勿提交私人录音、完整书籍、购买凭据、邮箱或 Apple 账户信息。"
  - type: input
    id: version
    attributes:
      label: App 版本与构建号
      placeholder: 例如 1.0（155）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与 iOS 版本
      placeholder: 例如 iPhone 17 / iOS 26
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述与复现步骤
      description: 请说明进行了什么操作、预期结果与实际结果。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误提示或截图（可选）
      description: 请先遮挡截图中的个人信息。
